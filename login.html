
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <title>School Login</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .login-box {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px #00000015;
    }
    .login-box input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccd5e0;
      border-radius: 7px;
      font-size: 16px;
    }
    .login-box button {
      width: 100%;
      padding: 13px;
      background: #0b1f3a;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-box a { color: #0077cc; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>

<header>
  <h1>School Management System</h1>
  <p>By Gebreslassie</p>
</header>

<div class="login-box">
  <h2>School Login</h2>

  <form id="loginForm">
    <input type="email" id="email"
      placeholder="Email address" required>

    <input type="password" id="password"
      placeholder="Password" required>

    <button type="submit" id="loginButton">Login</button>
  </form>

  <p id="message"></p>

  <p>
    Don't have an account?
    <a href="./register.html">Register here</a>
  </p>
</div>

<script type="module">
 import {
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import { auth, db } from "./firebase.js";

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const button = document.getElementById("loginButton");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";
    message.textContent = "";

    try {
      const result = await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      const user = result.user;

      const schoolRef = doc(db, "schools", user.uid);
      const schoolSnap = await getDoc(schoolRef);

      if (!schoolSnap.exists()) {
        await signOut(auth);
        throw new Error("School registration record not found.");
      }

      const school = schoolSnap.data();

      if (school.status !== "pending" && school.status !== "active") {
        await signOut(auth);
        throw new Error("Your school account is not approved.");
      }

      window.location.href = "./index.html";

    } catch (error) {
      console.error(error);

      if (error.code === "auth/invalid-credential") {
        message.textContent = "Incorrect email or password.";
      } else if (error.code === "auth/too-many-requests") {
        message.textContent = "Too many attempts. Please try again later.";
      } else {
        message.textContent = error.message;
      }

      message.style.color = "red";
      button.disabled = false;
      button.textContent = "Login";
    }
  });
</script>

</body>
</html>
