<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Account Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1f3a;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 14px;
    }
    h2 { color: #0b1f3a; text-align: center; }
    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #0b1f3a;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
    }
    #message { text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Register School Account</h2>
    <form id="registerForm">
      <input id="school" type="text" placeholder="School name" required>
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
      <button type="submit">Create Account</button>
    </form>
    <p id="message"></p>
    <p><a href="./login.html">Already have an account? Login</a></p>
  </div>

  <script type="module">
    import {
      auth,
      db,
      createUserWithEmailAndPassword,
      collection,
      addDoc
    } from "./firebase.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const school = document.getElementById("school").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Please wait...";

      try {
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        await addDoc(collection(db, "schools"), {
          schoolName: school,
          email: email,
          uid: result.user.uid,
          createdAt: new Date().toISOString(),
          status: "pending"
        });

        message.textContent = "Account created. Please login.";
        form.reset();

      } catch (error) {
        message.textContent = "Registration failed: " + error.message;
      }
    });
  </script>
</body>
</html>
