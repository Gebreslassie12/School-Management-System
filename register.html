
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <title>School Registration</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .register-box {
      max-width: 480px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px #00000015;
    }
    .register-box input {
      max-width: 100%;
    }
    .register-box button {
      width: 100%;
      padding: 13px;
      background: #087ec4;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }
    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <header>
    <h1>School Management System</h1>
    <p>By Gebreslassie</p>
  </header>

  <div class="register-box">
    <h2>Register Your School</h2>

    <form id="registerForm">
      <input type="text" id="schoolName"
        placeholder="School name" required>

      <input type="text" id="ownerName"
        placeholder="Owner full name" required>

      <input type="email" id="email"
        placeholder="Email address" required>

      <input type="tel" id="phone"
        placeholder="Phone number" required>

      <input type="password" id="password"
        placeholder="Password (minimum 6 characters)"
        minlength="6" required>

      <button type="submit" id="registerButton">
        Register School
      </button>
    </form>

    <p id="message"></p>

    <p>Already registered?
      <a href="./login.html">Login here</a>
    </p>
  </div>

  <script type="module">
    import {
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    import { auth, db } from "./firebase.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Registering...";

      let user = null;

      try {
        const schoolName =
          document.getElementById("schoolName").value.trim();
        const ownerName =
          document.getElementById("ownerName").value.trim();
        const email =
          document.getElementById("email").value.trim();
        const phone =
          document.getElementById("phone").value.trim();
        const password =
          document.getElementById("password").value;

        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        user = result.user;

        await setDoc(doc(db, "schools", user.uid), {
          schoolName,
          ownerName,
          email,
          phone,
          status: "pending",
          createdAt: serverTimestamp()
        });

        message.textContent =
          "Registration successful. Please login.";

        form.reset();

        setTimeout(() => {
          window.location.href = "./login.html";
        }, 2000);

      } catch (error) {
        if (user) {
          message.textContent =
            "Account created, but school details could not be saved. Contact the administrator. Error: " +
            error.message;
        } else {
          message.textContent = "Registration failed: " + error.message;
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
