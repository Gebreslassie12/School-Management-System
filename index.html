
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="School Management System by Gebreslassie">

  <title>School Management System</title>

  <link rel="stylesheet" href="./style.css">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="School System">

  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    #appError {
      display: none;
      margin: 20px;
      padding: 15px;
      border: 1px solid #dc3545;
      border-radius: 8px;
      background: #fff0f0;
      color: #8b0000;
      overflow-wrap: anywhere;
    }

    #appError pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <header>
    <h1>School Management System</h1>
    <p>By Gebreslassie</p>

    <div style="margin: 12px;">
      <label for="languageSelect">Language / ቋንቋ:</label>

      <select id="languageSelect">
        <option value="en">English</option>
        <option value="ti">ትግርኛ</option>
      </select>
    </div>
  </header>

  <nav>
    <button type="button" class="active"
      onclick="showPage('dashboard', this)">
      Dashboard
    </button>

    <button type="button"
      onclick="showPage('students', this)">
      Students
    </button>

    <button type="button"
      onclick="showPage('teachers', this)">
      Teachers
    </button>

    <button type="button"
      onclick="showPage('performance', this)">
      Teacher Performance
    </button>

    <button type="button"
      onclick="showPage('classes', this)">
      Classes &amp; Subjects
    </button>

    <button type="button"
      onclick="showPage('attendance', this)">
      Attendance
    </button>

    <button type="button"
      onclick="showPage('results', this)">
      Exams &amp; Results
    </button>

    <button type="button"
      onclick="showPage('reports', this)">
      Reports
    </button>
  </nav>

  <main id="content">
    <p id="loadingMessage">
      Loading School Management System...
    </p>
  </main>

  <div id="appError">
    <h3>Application Error</h3>
    <p>The application could not load correctly.</p>
    <pre id="errorDetails"></pre>
  </div>

  <footer>
    School Management System · By Gebreslassie
  </footer>

  <!-- Error reporting -->
  <script>
    window.showPage = function(page, button) {
      console.warn("Application is still loading. Requested page:", page);
    };

    function displayAppError(message) {
      const errorBox = document.getElementById("appError");
      const errorDetails = document.getElementById("errorDetails");

      if (errorBox && errorDetails) {
        errorDetails.textContent = String(message);
        errorBox.style.display = "block";
      }
    }

    window.addEventListener("error", function(event) {
      displayAppError(
        "Error: " + (event.message || "Unknown error") +
        "\nFile: " + (event.filename || "Unknown") +
        "\nLine: " + (event.lineno || "Unknown")
      );
    });

    window.addEventListener("unhandledrejection", function(event) {
      const reason = event.reason;
      displayAppError(
        "Promise Error: " +
        (reason && reason.message ? reason.message : String(reason))
      );
    });

    window.addEventListener("load", function() {
      setTimeout(function() {
        const loading = document.getElementById("loadingMessage");

        if (loading && loading.isConnected) {
          displayAppError(
            "The application did not replace the loading message. " +
            "Check app.js, Firebase authentication, and JavaScript errors."
          );
        }
      }, 12000);
    });
  </script>

  <!-- Language translation -->
  <script src="./language.js"></script>

  <!-- Main application -->
  <script type="module" src="./app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js")
          .then(function(registration) {
            console.log(
              "Service Worker registered successfully:",
              registration.scope
            );
          })
          .catch(function(error) {
            console.error(
              "Service Worker registration failed:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
