
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="School Management System by Gebreslassie">

  <title>School Management System</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
</head>

<body>

  <header>
    <h1>School Management System</h1>
    <p>By Gebreslassie</p>
  </header>

  <nav>
    <button type="button" class="active"
      onclick="showPage('dashboard', this)">
      Dashboard
    </button>

    <button type="button"
      onclick="showPage('students', this)">
      Students
    </button>

    <button type="button"
      onclick="showPage('teachers', this)">
      Teachers
    </button>

    <button type="button"
      onclick="showPage('performance', this)">
      Teacher Performance
    </button>

    <button type="button"
      onclick="showPage('classes', this)">
      Classes & Subjects
    </button>

    <button type="button"
      onclick="showPage('attendance', this)">
      Attendance
    </button>

    <button type="button"
      onclick="showPage('results', this)">
      Exams & Results
    </button>

    <button type="button"
      onclick="showPage('reports', this)">
      Reports
    </button>
  </nav>

  <main id="content">
    <p>Loading School Management System...</p>
  </main>

  <footer>
    School Management System · By Gebreslassie
  </footer>

  <!-- Main Application -->
  <script type="module" src="./app.js"></script>

  <!-- PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => {
            console.log("Service Worker registered successfully.");
          })
          .catch(error => {
            console.error("Service Worker error:", error);
          });
      });
    }
  </script>

</body>
</html>
