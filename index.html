
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="School Management System by Gebreslassie">

  <title>School Management System</title>

  <!-- App Styles -->
  <link rel="stylesheet" href="./style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- App Icon -->
  <link rel="icon" href="./icons/icon-192.png" type="image/png">

  <!-- Mobile App Theme -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="School System">

  <link rel="apple-touch-icon" href="./icons/icon-192.png">

</head>

<body>

  <!-- Header -->
  <header>
    <h1>School Management System</h1>
    <p>By Gebreslassie</p>
  </header>

  <!-- Navigation -->
  <nav>

    <button
      type="button"
      class="active"
      onclick="showPage('dashboard', this)">
      Dashboard
    </button>

    <button
      type="button"
      onclick="showPage('students', this)">
      Students
    </button>

    <button
      type="button"
      onclick="showPage('teachers', this)">
      Teachers
    </button>

    <button
      type="button"
      onclick="showPage('performance', this)">
      Teacher Performance
    </button>

    <button
      type="button"
      onclick="showPage('classes', this)">
      Classes & Subjects
    </button>

    <button
      type="button"
      onclick="showPage('attendance', this)">
      Attendance
    </button>

    <button
      type="button"
      onclick="showPage('results', this)">
      Exams & Results
    </button>

    <button
      type="button"
      onclick="showPage('reports', this)">
      Reports
    </button>

  </nav>

  <!-- Main Application Content -->
  <main id="content">

    <p>Loading School Management System...</p>

  </main>

  <!-- Footer -->
  <footer>
    School Management System · By Gebreslassie
  </footer>

  <!-- Main Application JavaScript -->
  <script type="module" src="./app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker.register("./sw.js")

          .then((registration) => {

            console.log(
              "Service Worker registered successfully:",
              registration.scope
            );

          })

          .catch((error) => {

            console.error(
              "Service Worker registration failed:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>
