<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="School Management System by Gebreslassie">
  <title>School Management System</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

  <header>
    <h1>School Management System</h1>
    <p>By Gebreslassie</p>
  </header>

  <nav>
    <button class="active" onclick="showPage('dashboard', this)">Dashboard</button>
    <button onclick="showPage('students', this)">Students</button>
    <button onclick="showPage('teachers', this)">Teachers</button>
    <button onclick="showPage('performance', this)">Teacher Performance</button>
    <button onclick="showPage('classes', this)">Classes & Subjects</button>
    <button onclick="showPage('attendance', this)">Attendance</button>
    <button onclick="showPage('results', this)">Exams & Results</button>
    <button onclick="showPage('reports', this)">Reports</button>
  </nav>

  <main id="content"></main>

  <footer>School Management System · By Gebreslassie</footer>

  <script type="module" src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.log("Service worker:", error));
      });
    }
  </script>

</body>
</html>
